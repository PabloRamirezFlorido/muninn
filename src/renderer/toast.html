<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    .t {
      margin: 8px; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: rgba(10, 17, 21, 0.95); color: #E6EEF2; border-radius: 12px;
      border: 1px solid rgba(156, 195, 211, 0.12); border-left: 4px solid #58A9BF;
      transform: translateX(110%); transition: transform .25s ease;
    }
    .t.show { transform: none; }
    .t.info { border-left-color: #8AA0AB; }
    .t.warn { border-left-color: #E8A33A; }
    .t.error { border-left-color: #E3242B; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; color: #58A9BF; }
    .info .dot { color: #8AA0AB; } .warn .dot { color: #E8A33A; } .error .dot { color: #E3242B; box-shadow: 0 0 8px #FF2A2A; }
    b { display: block; font-size: 14px; }
    span { font-size: 12.5px; color: #8AA0AB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 280px; }
  </style>
</head>
<body>
  <div class="t" id="t"><div class="dot"></div><div><b id="title"></b><span id="body"></span></div></div>
  <script>
    const el = document.getElementById('t');
    let timer;
    window.muninn.on('toast', ({ title, body, kind }) => {
      el.className = `t ${kind}`;
      document.getElementById('title').textContent = title;
      document.getElementById('body').textContent = body || '';
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(timer);
      timer = setTimeout(() => el.classList.remove('show'), 3100);
    });
  </script>
</body>
</html>
